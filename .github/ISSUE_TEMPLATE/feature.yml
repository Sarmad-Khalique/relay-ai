name: Feature request
description: Propose a focused improvement to ProvenWay
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or safety problem should ProvenWay solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: contract
    attributes:
      label: Does this affect a public schema, CLI command, or security boundary?
      options: ["Yes", "No", "Unsure"]
    validations:
      required: true
